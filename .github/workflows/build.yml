name: Build Fovelle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtimageformats'
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTS=ON
          -DFOVELLE_BUILD_TRANSLATIONS=OFF
          -DQV_DISABLE_ONLINE_VERSION_CHECK=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package Fovelle
        run: ditto -c -k --sequesterRsrc --keepParent build/Fovelle.app Fovelle-macOS.zip

      - name: Upload Fovelle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fovelle-macOS
          path: Fovelle-macOS.zip
