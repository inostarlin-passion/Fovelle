name: Build Fovelle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    uses: ./.github/workflows/test.yml
  build:
    needs: format
    # Run macOS jobs natively on Apple Silicon.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: |
            .github/requirements-ci.txt
            tests/requirements.txt

      - name: Install pinned build and test tools
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: Verify Xcode and macOS SDK
        shell: bash
        run: |
          echo "Runner architecture $(uname -m)"
          test "$(uname -m)" = "arm64"
          XCODE_VERSION="$(xcodebuild -version | awk '$1 == "Xcode" { print $2 }')"
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Xcode ${XCODE_VERSION}"
          echo "macOS SDK ${SDK_VERSION}"
          test "${XCODE_VERSION%%.*}" -ge 26
          test "${SDK_VERSION%%.*}" -ge 26

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.11.2'
          modules: 'qtimageformats'
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.0'

      - name: Install Ghostscript for EPS rendering
        run: brew install ghostscript

      - name: Verify pinned environment
        run: python .github/scripts/verify_environment.py --lane main --output build/ci-environment.json

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DFOVELLE_EXTENDED_TESTS=OFF
          -DFOVELLE_REQUIRE_PORTABLE_HDR=ON
          -DFOVELLE_BUILD_TRANSLATIONS=ON
          -DQV_DISABLE_ONLINE_VERSION_CHECK=ON
          -DPython3_EXECUTABLE="$(command -v python)"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Build
        run: cmake --build build --parallel 2

      - name: Verify fixed adjacent preload policy
        run: python3 tests/preload_policy_quality.py

      - name: Test
        env:
          FOVELLE_TEST_PROFILE: ci
        run: ctest --test-dir build --output-on-failure

      - name: Upload portable HDR execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-diagnostics
          retention-days: 7
          path: |
            build/test-results/portable-hdr/
            build/test-results/fast/
            build/Testing/Temporary/LastTest.log
            build/ci-environment.json
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      - name: Deploy and validate Qt bundle
        run: |
          macdeployqt build/Fovelle.app -always-overwrite
          python3 dist/scripts/verify-macos-bundle.py build/Fovelle.app --sanitize --sign-adhoc
          python3 dist/scripts/verify-macos-bundle.py build/Fovelle.app

      - name: Package Fovelle
        run: ditto -c -k --sequesterRsrc --keepParent build/Fovelle.app Fovelle-macOS.zip

      - name: Validate extracted artifact
        run: |
          ditto -x -k Fovelle-macOS.zip "$RUNNER_TEMP/fovelle-verified"
          python3 dist/scripts/verify-macos-bundle.py "$RUNNER_TEMP/fovelle-verified/Fovelle.app"

      - name: Upload Fovelle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fovelle-macOS
          path: Fovelle-macOS.zip
