name: Build Fovelle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode and macOS SDK
        shell: bash
        run: |
          XCODE_VERSION="$(xcodebuild -version | awk '$1 == "Xcode" { print $2 }')"
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Xcode ${XCODE_VERSION}"
          echo "macOS SDK ${SDK_VERSION}"
          test "${XCODE_VERSION%%.*}" -ge 26
          test "${SDK_VERSION%%.*}" -ge 26

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtimageformats'
          cache: true

      - name: Install Ghostscript for EPS rendering
        run: brew install ghostscript

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTS=ON
          -DFOVELLE_BUILD_TRANSLATIONS=ON
          -DQV_DISABLE_ONLINE_VERSION_CHECK=ON
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 90

      - name: Package Fovelle
        run: ditto -c -k --sequesterRsrc --keepParent build/Fovelle.app Fovelle-macOS.zip

      - name: Upload Fovelle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fovelle-macOS
          path: Fovelle-macOS.zip
