name: Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Run clang-format
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: .github/requirements-format.txt

      - name: Install pinned formatter
        run: python -m pip install --disable-pip-version-check -r .github/requirements-format.txt

      - name: Verify pinned environment
        run: python .github/scripts/verify_environment.py --lane format --output ci-environment-format.json

      - name: Validate CI configuration
        run: python tests/ci_runner_policy_tests.py

      - name: Run clang-format
        run: python .github/scripts/check_format.py

      - name: Upload format environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: format-environment
          path: ci-environment-format.json
          retention-days: 7
          if-no-files-found: ignore
