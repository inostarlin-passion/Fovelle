name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8'
          cache: true
          modules: 'qtimageformats'

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTS=ON -DQV_DISABLE_ONLINE_VERSION_CHECK=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: QT_QPA_PLATFORM=cocoa ctest --test-dir build --output-on-failure --timeout 90

  clang-tidy:
    name: Run clang-tidy
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8'
          cache: true
          modules: 'qtimageformats'

      - name: Install clang-tidy
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Run clang-tidy
        run: ./build.sh --tidy

  format:
    name: Run clang-format
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8'
          cache: true
          modules: 'qtimageformats'

      - name: Install clang-format
        run: |
          brew install clang-format
          echo "$(brew --prefix clang-format)/bin" >> "$GITHUB_PATH"

      - name: Run clang-format
        run: ./build.sh --format-check
