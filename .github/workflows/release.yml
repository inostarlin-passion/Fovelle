name: Release Fovelle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtimageformats'
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTS=ON
          -DFOVELLE_BUILD_TRANSLATIONS=OFF
          -DQV_DISABLE_ONLINE_VERSION_CHECK=ON
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: QT_QPA_PLATFORM=cocoa ctest --test-dir build --output-on-failure

      - name: Sign, notarize, validate, and package Fovelle
        timeout-minutes: 45
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_APP_PATH: build/Fovelle.app
          RELEASE_ZIP_PATH: Fovelle-${{ github.ref_name }}-macOS-universal.zip
          NOTARIZATION_TIMEOUT: "30m"
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash dist/scripts/package-macos-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Fovelle ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: Fovelle-${{ github.ref_name }}-macOS-universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
