name: Release Fovelle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/build.yml
  release:
    needs: ci
    permissions:
      contents: write
    name: Build and publish macOS release
    # Run macOS jobs natively on Apple Silicon.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          RELEASE_TAG="v$(cat VERSION)"
          if [[ "$EVENT_NAME" == "push" ]]; then
            test "$REF_TYPE" = tag
            RELEASE_TAG="$REF_NAME"
          fi
          python3 dist/scripts/validate-release.py --tag "$RELEASE_TAG"

      - name: Verify Xcode and macOS SDK
        shell: bash
        run: |
          echo "Runner architecture $(uname -m)"
          test "$(uname -m)" = "arm64"
          XCODE_VERSION="$(xcodebuild -version | awk '$1 == "Xcode" { print $2 }')"
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          echo "Xcode ${XCODE_VERSION}"
          echo "macOS SDK ${SDK_VERSION}"
          echo "macOS SDK path ${SDK_PATH}"
          test "${XCODE_VERSION%%.*}" -ge 16
          test "${SDK_VERSION%%.*}" -eq 15
          test -d "${SDK_PATH}"

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: |
            .github/requirements-ci.txt
            tests/requirements.txt

      - name: Install pinned build and test tools
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.11.2'
          modules: 'qtimageformats'
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.0'

      - name: Install Ghostscript for EPS rendering tests
        run: brew install ghostscript

      - name: Verify pinned environment
        run: python .github/scripts/verify_environment.py --lane compatibility --output build/ci-environment.json

      - name: Configure
        env:
          FOVELLE_UPDATE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DFOVELLE_EXTENDED_TESTS=OFF
          -DFOVELLE_ENABLE_UPDATE_INSTALL_TESTS=ON
          -DFOVELLE_REQUIRE_PORTABLE_HDR=ON
          -DFOVELLE_UPDATE_FEED_URL="https://github.com/inostarlin-passion/Fovelle/releases/latest/download/appcast.xml"
          -DFOVELLE_UPDATE_PUBLIC_KEY="$FOVELLE_UPDATE_PUBLIC_KEY"
          -DFOVELLE_REQUIRE_UPDATE_CONFIG=ON
          -DFOVELLE_BUILD_TRANSLATIONS=ON
          -DQV_DISABLE_ONLINE_VERSION_CHECK=OFF
          -DPython3_EXECUTABLE="$(command -v python)"
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"

      - name: Build
        run: cmake --build build --parallel 2

      # grabWindow captures composited desktop pixels, including the Dock's
      # shadow on macOS 15 even when auto-hidden. Move it away from the
      # bottom strip under test as well as keeping it hidden.
      - name: Move Dock away from bottom display capture tests
        run: |
          defaults write com.apple.dock orientation -string left
          defaults write com.apple.dock autohide -bool true
          killall Dock || true

      - name: Test
        env:
          FOVELLE_TEST_PROFILE: ci
          FOVELLE_DISABLE_AUTO_UPDATE_CHECK: "1"
          FOVELLE_FULLSCREEN_BOTTOM_EVIDENCE: ${{ runner.temp }}/fullscreen-bottom-evidence
        run: QT_QPA_PLATFORM=cocoa ctest --test-dir build --output-on-failure

      - name: Upload portable HDR execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics
          retention-days: 7
          path: |
            build/test-results/portable-hdr/
            build/test-results/fast/
            build/Testing/Temporary/LastTest.log
            build/ci-environment.json
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      - name: Upload failed fullscreen display evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fullscreen-bottom-evidence
          path: ${{ runner.temp }}/fullscreen-bottom-evidence
          if-no-files-found: ignore

      - name: Sign, notarize, validate, and package Fovelle
        timeout-minutes: 45
        env:
          FOVELLE_GENERATE_APPCAST: "true"
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_APP_PATH: build/Fovelle.app
          RELEASE_ZIP_PATH: Fovelle-${{ steps.identity.outputs.tag }}-macOS-universal.zip
          NOTARIZATION_TIMEOUT: "30m"
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash dist/scripts/package-macos-release.sh

      - name: Upload verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          if-no-files-found: error
          path: |
            Fovelle-${{ steps.identity.outputs.tag }}-macOS-universal.zip
            build/update-release/appcast.xml

      - name: Upload final artifact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifact-evidence
          retention-days: 7
          path: |
            build/test-results/release-artifact/
            build/test-results/update-install/
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Fovelle ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Fovelle-${{ github.ref_name }}-macOS-universal.zip
            build/update-release/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
